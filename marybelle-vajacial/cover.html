<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Couverture TikTok</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@600;700;800&family=Pinyon+Script&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
#c{position:relative;width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;text-align:center;
 background:radial-gradient(120% 70% at 50% 30%,#F6EBE1 0%,#EBD6C4 55%,#DCBFA8 100%);font-family:'Cormorant Garamond',serif;color:#3B2A1F;font-variant-numeric:lining-nums}
#c:before{content:"";position:absolute;inset:38px;border:2px solid rgba(184,144,79,.55);border-radius:28px}
#c:after{content:"";position:absolute;inset:50px;border:1px solid rgba(184,144,79,.35);border-radius:20px}
.logo{margin-top:200px;width:560px;height:560px;border-radius:50%;box-shadow:0 40px 90px rgba(80,50,25,.35),0 0 0 10px rgba(241,219,166,.4)}
.logo img{width:100%;height:100%;border-radius:50%;display:block}
.q{margin-top:90px;font-family:'Montserrat';font-weight:800;font-size:92px;line-height:1.04;letter-spacing:-1px;color:#2A1D14}
.q b{display:block;font-family:'Cormorant Garamond';font-weight:700;font-size:124px;letter-spacing:1px;
 background:linear-gradient(100deg,#8A6630,#B8904F 25%,#D9B877 48%,#B8904F 65%,#8A6630);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{margin-top:70px;padding:30px 64px;border-radius:999px;background:#120E0B;box-shadow:0 22px 50px rgba(60,35,15,.4);
 font-weight:700;font-size:96px;line-height:1;
 }
.badge span{background:linear-gradient(100deg,#B98F4C,#E7C988 30%,#FFF1CC 48%,#E3BF7A 62%,#B48A46);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{margin-top:70px;font-family:'Pinyon Script';font-size:96px;color:#8A6630}
</style></head><body>
<div id="c">
  <div class="logo"><img src="assets/logo-round.png" alt=""></div>
  <div class="q">VOUS CONNAISSEZ<b>LE VAJACIAL&nbsp;?</b></div>
  <div class="badge"><span>DÈS 25&nbsp;000 F CFA</span></div>
  <div class="brand">Mary Belle Cosmetics</div>
</div>
</body></html>
